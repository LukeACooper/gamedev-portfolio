<header class="success" id="CV">
  
  <!-- Global Eggshell Text Override for Colored Backgrounds -->
  <style>
    header, .success, footer {
      color: #F4F1DE !important;
    }
    header h1, header h2, header h3, header h4, header span, header p, header li, header strong, 
    .success h1, .success h2, .success h3, .success h4, .success span, .success p, .success li, .success strong,
    footer h1, footer h2, footer h3, footer h4, footer span, footer p, footer li, footer strong {
      color: #F4F1DE !important;
    }
    
    /* Dynamic Responsive Spacing */
    section { padding: 50px 0; }
    header { padding: 100px 0 50px; }

    @media(min-width: 768px) {
      section { padding: 80px 0; }
      header { padding: 130px 0 80px; }
    }
    
    /* Clean List Formatting */
    .skills-list li {
      margin-bottom: 8px;
    }
  </style>

  <div class="container">
    
    <!--TOP SECTION-->
    <div class="row" style="display: flex; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
      <div class="col-md-7 col-sm-12" style="text-align: left;">
        <h1 style="margin-bottom: 10px; font-weight: 700; text-transform: uppercase;">{{ site.title }}</h1>
        <h3 style="margin-top: 0; font-weight: 400; opacity: 0.9;">{{ site.skills }}</h3>
      </div>
      <div class="col-md-5 col-sm-12">
        <img class="img-responsive img-circle" src="img/profile.png" alt="profile-pic" style="max-width: 280px; margin: 0 auto; display: block; border: 4px solid #F4F1DE;"/>
      </div>
    </div>
    
    <!-- DIVIDER -->
    <div class="row">
      <div class="col-lg-12">
        <hr style="border-top: 2px solid #F4F1DE; width: 100%; opacity: 0.7; margin: 20px 0;">
      </div>
    </div>

    
    <!-- CV Button -->
    <div class="row">
      <div class="col-lg-12 text-center" style="margin-top: 40px;">
        <a href="cv/LukeCooper_CV.pdf" target="_blank" rel="noopener noreferrer" class="btn btn-lg" style="background-color: #FE6900; color: white; border: none; font-weight: bold; padding: 15px 30px; border-radius: 6px; font-size: 1.1em; transition: transform 0.2s ease;">
          <i class="fa fa-file-pdf-o"></i> View & Download Full CV
        </a>
      </div>
    </div>
    
  </div>
</header>
