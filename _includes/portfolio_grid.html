<!-- Portfolio Grid Section -->
<section id="portfolio" style="background-color: #F4F1DE;">
  <div class="container portfolio-flex-grid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 style="color: #264653;">Projects</h2>
        <hr class="star-primary">
      </div>
    </div>
    <div class="portfolio-flex-row">
      {% for post in site.posts %}
      <div class="portfolio-flex-item portfolio-item" style="text-align: center; margin-bottom: 30px;">
        <a href="#portfolioModal-{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
          <div class="caption">
            <div class="caption-content">
              <i class="fa fa-search-plus fa-3x" style="color: #F4F1DE;"></i>
            </div>
          </div>
          <img src="img/portfolio/{{ post.img }}" class="img-responsive" alt="{{ post.alt }}" style="margin: 0 auto;">
        </a>
        <h4 style="margin-top: 15px; font-size: 1.3em; font-weight: 600; color: #264653;">{{ post.title }}</h4>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
